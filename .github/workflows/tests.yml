name: Synthetic cache tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s Py -p TestCache.py -v
      - run: python -m unittest discover -s Py -p TestApi.py -v
      - run: python -m unittest discover -s Py -p TestBaseline.py -v
      - run: python -m unittest discover -s Py -p TestTransfer.py -v
      - run: python -m unittest discover -s Py -p TestLock.py -v
      - run: python -m unittest discover -s Py -p TestNightly.py -v
      - run: python -m unittest discover -s Py -p TestHeaderBackfill.py -v
      - run: python -m unittest discover -s Py -p TestMigration.py -v
